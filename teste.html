<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Responda ao teste e descubra seus pontos fortes.">
  <title>Teste | Mentes & Talentos</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="quiz-page">
  <header class="site-header compact">
    <a class="brand" href="index.html"><span class="brand-mark" aria-hidden="true">M</span><span>Mentes &amp; Talentos</span></a>
    <a class="quiet-link" href="index.html">Sair do teste</a>
  </header>
  <main class="quiz-shell">
    <section class="quiz-card" id="quiz" aria-live="polite">
      <div class="quiz-topline">
        <span class="quiz-category" id="quiz-category"></span>
        <span id="progress-label">Pergunta 1 de 5</span>
      </div>
      <div class="progress-track" aria-hidden="true"><div class="progress-fill" id="progress-fill"></div></div>
      <div id="question-area"></div>
      <div class="quiz-actions">
        <button class="button button-ghost" id="back-button" type="button">← Voltar</button>
        <button class="button button-primary" id="next-button" type="button" disabled>Próxima →</button>
      </div>
    </section>
  </main>
  <script src="js/tests-data.js"></script>
  <script src="js/test.js"></script>
</body>
</html>
